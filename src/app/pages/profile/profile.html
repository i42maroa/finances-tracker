<app-breadcrumb [items]="[{ label: 'Configuración', link: '/configuracion' }, { label: 'Perfil' }]" />
<div class="page-heading"><div><h1>Mi perfil<span>.</span></h1></div></div>
<section class="panel account-card" aria-labelledby="account-title"><span class="profile-avatar">{{ auth.user()!.name.charAt(0) }}</span><div><h2 id="account-title">{{ auth.user()!.name }}</h2><p>{{ auth.user()!.email }}</p><small>{{ auth.demo() ? 'Perfil de demostración' : 'Tu cuenta personal' }}</small></div></section>
